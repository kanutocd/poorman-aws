name: Application infrastructure

on:
  workflow_call:
    inputs:
      infrastructure_repository:
        description: "Repository containing the reusable infrastructure"
        required: true
        type: string
      infrastructure_ref:
        description: "Ref of the reusable infrastructure to execute"
        required: true
        type: string
      application_name:
        description: "Application identifier used in resource names and tags"
        required: true
        type: string
      environment:
        description: "Environment to plan or apply"
        required: true
        type: string
      apply:
        description: "Apply the reviewed plan in the selected protected environment"
        required: false
        default: false
        type: boolean
      aws_region:
        description: "AWS deployment region"
        required: true
        type: string
      state_bucket:
        description: "Encrypted S3 bucket containing OpenTofu state"
        required: true
        type: string
      availability_zone:
        description: "Single Availability Zone for the environment"
        required: true
        type: string
      instance_type:
        description: "EC2 instance type compatible with the AMI"
        required: false
        default: t4g.micro
        type: string
      root_volume_size_gib:
        description: "Disposable root EBS volume size in GiB"
        required: false
        default: 10
        type: number
      data_volume_size_gib:
        description: "Data EBS volume size in GiB"
        required: false
        default: 20
        type: number
      retain_eip:
        description: "Retain the EIP across guarded replacement or teardown"
        required: false
        default: true
        type: boolean
      retain_data_volume:
        description: "Retain the data EBS volume across instance replacement"
        required: false
        default: true
        type: boolean
      release_retention_days:
        description: "Current release retention period"
        required: false
        default: 30
        type: number
      enable_data_volume_backups:
        description: "Enable the production data-volume backup policy"
        required: false
        default: true
        type: boolean
      backup_kms_key_arn:
        description: "Optional customer-managed AWS Backup KMS key ARN"
        required: false
        type: string
      ssm_parameter_path:
        description: "SSM path used by the application host"
        required: true
        type: string
      ssm_session_kms_key_arn:
        description: "Optional customer-managed Session Manager KMS key ARN"
        required: false
        type: string
      route53_zone_name:
        description: "Existing public Route 53 hosted zone name"
        required: true
        type: string
      route53_zone_id:
        description: "Optional existing public Route 53 hosted zone ID"
        required: false
        type: string
      tags_json:
        description: "Additional resource tags as a JSON object"
        required: false
        default: '{}'
        type: string
      ami_subnet_id:
        description: "Public subnet for the idempotent AMI build or reuse check"
        required: true
        type: string
      ami_name_prefix:
        description: "AMI name prefix"
        required: true
        type: string
    secrets:
      aws_role_arn:
        description: "IAM role allowed to manage this environment"
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ inputs.application_name }}-infrastructure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest

    steps:
      - name: Reject floating infrastructure ref in production
        if: inputs.environment == 'production' && (inputs.infrastructure_ref == 'main' || inputs.infrastructure_ref == 'master')
        run: |
          echo 'production requires an immutable infrastructure ref' >&2
          exit 1

      - name: Check out infrastructure repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.infrastructure_repository }}
          ref: ${{ inputs.infrastructure_ref }}
          path: poorman-aws

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive poorman-aws/backend

      - name: Initialize without remote state
        working-directory: poorman-aws/backend
        run: tofu init -backend=false -input=false

      - name: Validate OpenTofu configuration
        working-directory: poorman-aws/backend
        run: tofu validate

      - name: Check host scripts
        run: bash -n poorman-aws/backend/scripts/* poorman-aws/bin/kill-non-production

  build_or_resolve_ami:
    name: Build or reuse host AMI
    needs: validate
    # use this format to make rhysd/actionlint happy
    uses: kanutocd/poorman-aws/.github/workflows/build-backend-ami.yml@v0.1.0
    permissions:
      contents: read
      actions: write
      id-token: write
    with:
      infrastructure_repository: ${{ inputs.infrastructure_repository }}
      infrastructure_ref: ${{ inputs.infrastructure_ref }}
      application_name: ${{ inputs.application_name }}
      aws_region: ${{ inputs.aws_region }}
      subnet_id: ${{ inputs.ami_subnet_id }}
      ami_name_prefix: ${{ inputs.ami_name_prefix }}
      target_environment: ${{ inputs.environment }}
    secrets: inherit

  plan:
    name: Plan ${{ inputs.environment }}
    needs: [validate, build_or_resolve_ami]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      APPLICATION_NAME: ${{ inputs.application_name }}
      AWS_REGION: ${{ inputs.aws_region }}
      TF_VAR_application_name: ${{ inputs.application_name }}
      TF_VAR_aws_region: ${{ inputs.aws_region }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_availability_zone: ${{ inputs.availability_zone }}
      TF_VAR_instance_type: ${{ inputs.instance_type }}
      TF_VAR_root_volume_size_gib: ${{ inputs.root_volume_size_gib }}
      TF_VAR_data_volume_size_gib: ${{ inputs.data_volume_size_gib }}
      TF_VAR_retain_eip: ${{ inputs.retain_eip }}
      TF_VAR_retain_data_volume: ${{ inputs.retain_data_volume }}
      TF_VAR_release_retention_days: ${{ inputs.release_retention_days }}
      TF_VAR_enable_data_volume_backups: ${{ inputs.enable_data_volume_backups }}
      TF_VAR_backup_kms_key_arn: ${{ inputs.backup_kms_key_arn }}
      TF_VAR_ssm_parameter_path: ${{ inputs.ssm_parameter_path }}
      TF_VAR_ssm_session_kms_key_arn: ${{ inputs.ssm_session_kms_key_arn }}
      TF_VAR_route53_zone_name: ${{ inputs.route53_zone_name }}
      TF_VAR_route53_zone_id: ${{ inputs.route53_zone_id }}
      TF_VAR_tags: ${{ inputs.tags_json }}
      TF_VAR_ami_id: ${{ needs.build_or_resolve_ami.outputs.ami_id }}

    steps:
      - name: Check out infrastructure repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.infrastructure_repository }}
          ref: ${{ inputs.infrastructure_ref }}
          path: poorman-aws

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Require resolved AMI ID
        env:
          AMI_ID: ${{ needs.build_or_resolve_ami.outputs.ami_id }}
        run: |
          set -euo pipefail
          [[ "$AMI_ID" =~ ^ami-[0-9a-f]+$ ]] || {
            echo 'build_or_resolve_ami did not return a valid AMI ID' >&2
            exit 1
          }

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.aws_role_arn || secrets.AWS_ROLE_ARN }}
          role-session-name: ${{ inputs.application_name }}-infrastructure-${{ inputs.environment }}-${{ github.run_id }}

      - name: Initialize environment state
        working-directory: poorman-aws/backend
        run: >-
          tofu init -reconfigure
          -backend-config="bucket=${{ inputs.state_bucket }}"
          -backend-config="key=${{ inputs.application_name }}/backend/${{ inputs.environment }}/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Repair tainted retained EIP state
        if: inputs.retain_eip
        working-directory: poorman-aws/backend
        env:
          EXPECTED_APPLICATION: ${{ inputs.application_name }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          state_json="$(tofu state pull 2>/dev/null || true)"
          tainted_allocation_id="$(jq -r '
            .resources[]? |
            select(.module? == "module.compute" and .type? == "aws_eip" and .name? == "this") |
            .instances[]? |
            select(.status? == "tainted") |
            .attributes.id // empty
          ' <<<"$state_json" | head -n 1)"
          if [[ -z "$tainted_allocation_id" ]]; then
            echo 'No tainted retained EIP state found.'
            exit 0
          fi

          echo "Found tainted retained EIP state: $tainted_allocation_id"
          eip_metadata=''
          # shellcheck disable=SC2016
          for attempt in 1 2 3 4; do
            if eip_metadata="$(aws ec2 describe-addresses \
              --region "$AWS_REGION" \
              --allocation-ids "$tainted_allocation_id" \
              --query 'Addresses[0].[AllocationId,Tags[?Key==`Application`].Value | [0],Tags[?Key==`Environment`].Value | [0],Tags[?Key==`ManagedBy`].Value | [0],Tags[?Key==`Component`].Value | [0]]' \
              --output text 2>/dev/null)" && [[ "$eip_metadata" != 'None' ]]; then
              break
            fi
            [[ "$attempt" -eq 4 ]] || sleep $((attempt * 2))
          done

          read -r actual_allocation_id actual_application actual_environment actual_managed_by actual_component <<<"$eip_metadata"
          [[ "$actual_allocation_id" == "$tainted_allocation_id" &&
            "$actual_application" == "$EXPECTED_APPLICATION" &&
            "$actual_environment" == "$EXPECTED_ENVIRONMENT" &&
            "$actual_managed_by" == 'opentofu' &&
            "$actual_component" == 'backend' ]] || {
            echo 'Refusing to untaint EIP: live allocation or ownership tags do not match.' >&2
            exit 1
          }

          tofu untaint module.compute.aws_eip.this
          echo "Untainted verified retained EIP: $tainted_allocation_id"

      - name: Create reviewed plan
        working-directory: poorman-aws/backend
        run: tofu plan -out=backend.tfplan

      - name: Apply exact reviewed plan
        if: inputs.apply
        working-directory: poorman-aws/backend
        run: tofu apply backend.tfplan

      - name: Publish redacted plan metadata
        if: always()
        run: |
          {
            echo "application=${{ inputs.application_name }}"
            echo "environment=${{ inputs.environment }}"
            echo "commit=${GITHUB_SHA}"
            echo "applied=${{ inputs.apply }}"
          } > backend-plan-metadata.txt

      - name: Upload plan metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.application_name }}-${{ inputs.environment }}-plan-metadata-${{ github.run_id }}
          path: backend-plan-metadata.txt
          if-no-files-found: error
