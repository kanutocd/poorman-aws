name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poorman-aws-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Restore documentation tools
        id: docs-tools-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .docs-tools
          key: docs-tools-${{ runner.os }}-${{ runner.arch }}-vale-3.21.0-lychee-0.24.2-markdownlint-0.23.2

      - name: Build documentation
        run: bin/docs build --strict

      - name: Install documentation linters
        if: steps.docs-tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tool_directory="$GITHUB_WORKSPACE/.docs-tools"
          mkdir -p "$tool_directory/bin"
          GOBIN="$tool_directory/bin" go install github.com/vale-cli/vale/v3/cmd/vale@v3.21.0
          cargo install --quiet --root "$tool_directory" lychee --version 0.24.2 --locked
          npm install --quiet --no-audit --no-fund --prefix "$tool_directory" markdownlint-cli2@0.23.2

      - name: Lint documentation
        run: |
          tool_directory="$GITHUB_WORKSPACE/.docs-tools"
          test -x "$tool_directory/bin/vale"
          test -x "$tool_directory/bin/lychee"
          test -x "$tool_directory/node_modules/.bin/markdownlint-cli2"
          "$tool_directory/bin/vale" docs/mkdocs README.md CHANGELOG.md
          "$tool_directory/node_modules/.bin/markdownlint-cli2" "**/*.md"
          "$tool_directory/bin/lychee" --offline "docs/mkdocs/**/*.md"

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
