name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poorman-aws-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Restore documentation tools
        id: docs-tools-cache
        uses: actions/cache@v4
        with:
          path: .docs-tools
          key: docs-tools-${{ runner.os }}-${{ runner.arch }}-vale-3.21.0-lychee-0.24.2-markdownlint-0.23.2

      - name: Build documentation
        run: bin/docs build --strict

      - name: Install documentation linters
        if: steps.docs-tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tool_directory="$GITHUB_WORKSPACE/.docs-tools"
          mkdir -p "$tool_directory/bin"
          GOBIN="$tool_directory/bin" go install github.com/vale-cli/vale/v3/cmd/vale@v3.21.0
          cargo install --quiet --root "$tool_directory" lychee --version 0.24.2 --locked
          npm install --quiet --no-audit --no-fund --prefix "$tool_directory" markdownlint-cli2@0.23.2

      - name: Lint documentation
        run: bin/docs lint

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
