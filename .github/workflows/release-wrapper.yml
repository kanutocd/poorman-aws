name: Release consumer wrapper

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate and package wrapper
        run: |
          bash -n bin/poorman-aws bin/package-wrapper
          bash tests/wrapper_release_test.sh
          bash bin/package-wrapper --version "$GITHUB_REF_NAME" --output-dir dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "poorman-aws $GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
          "dist/poorman-aws-$GITHUB_REF_NAME"
          "dist/poorman-aws-$GITHUB_REF_NAME.sha256"
