name: Kill non-production application environment

on:
  workflow_call:
    inputs:
      infrastructure_repository:
        description: "Repository containing the reusable infrastructure"
        required: true
        type: string
      infrastructure_ref:
        description: "Ref of the reusable infrastructure to execute"
        required: false
        default: main
        type: string
      application_name:
        description: "Application identifier used in resource tags and state"
        required: true
        type: string
      environment:
        description: "Non-production environment; only staging is supported"
        required: true
        type: string
      action:
        description: "STOP, DESTROY, or NUKE"
        required: true
        type: string
      confirmation:
        description: "Action-specific confirmation phrase"
        required: true
        type: string
      apply:
        description: "Actually execute the selected action"
        required: false
        default: false
        type: boolean
      aws_region:
        description: "AWS deployment region"
        required: true
        type: string
      state_bucket:
        description: "Encrypted S3 bucket containing OpenTofu state"
        required: false
        type: string
      availability_zone:
        description: "Single Availability Zone for the environment"
        required: false
        type: string
      instance_type:
        description: "EC2 instance type compatible with the AMI"
        required: false
        default: t4g.micro
        type: string
      root_volume_size_gib:
        description: "Disposable root EBS volume size in GiB"
        required: false
        default: 10
        type: number
      data_volume_size_gib:
        description: "Data EBS volume size in GiB"
        required: false
        default: 20
        type: number
      ssm_parameter_path:
        description: "SSM path used by the application host"
        required: false
        type: string
      ssm_session_kms_key_arn:
        description: "Optional customer-managed Session Manager KMS key ARN"
        required: false
        type: string
      route53_zone_name:
        description: "Existing public Route 53 hosted zone name"
        required: false
        type: string
      route53_zone_id:
        description: "Optional existing public Route 53 hosted zone ID"
        required: false
        type: string
      tags_json:
        description: "Additional resource tags as a JSON object"
        required: false
        default: '{}'
        type: string
    secrets:
      aws_role_arn:
        description: "IAM role allowed to manage the environment"
        required: true
      ami_id:
        description: "Reviewed AMI ID used by the OpenTofu state"
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ inputs.application_name }}-lifecycle-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  kill:
    name: ${{ inputs.action }} ${{ inputs.environment }} environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      APPLICATION_NAME: ${{ inputs.application_name }}
      AWS_REGION: ${{ inputs.aws_region }}
      KILL_ENVIRONMENT: ${{ inputs.environment }}
      KILL_ACTION: ${{ inputs.action }}
      KILL_CONFIRMATION: ${{ inputs.confirmation }}
      KILL_APPLY: ${{ inputs.apply }}
      STATE_BUCKET: ${{ inputs.state_bucket }}
      TF_VAR_application_name: ${{ inputs.application_name }}
      TF_VAR_aws_region: ${{ inputs.aws_region }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_availability_zone: ${{ inputs.availability_zone }}
      TF_VAR_ami_id: ${{ secrets.ami_id }}
      TF_VAR_instance_type: ${{ inputs.instance_type }}
      TF_VAR_root_volume_size_gib: ${{ inputs.root_volume_size_gib }}
      TF_VAR_data_volume_size_gib: ${{ inputs.data_volume_size_gib }}
      TF_VAR_ssm_parameter_path: ${{ inputs.ssm_parameter_path }}
      TF_VAR_ssm_session_kms_key_arn: ${{ inputs.ssm_session_kms_key_arn }}
      TF_VAR_route53_zone_name: ${{ inputs.route53_zone_name }}
      TF_VAR_route53_zone_id: ${{ inputs.route53_zone_id }}
      TF_VAR_tags: ${{ inputs.tags_json }}

    steps:
      - name: Check out infrastructure repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.infrastructure_repository }}
          ref: ${{ inputs.infrastructure_ref }}
          path: poorman-aws

      - name: Set up OpenTofu
        if: inputs.action != 'STOP'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.aws_role_arn }}
          role-session-name: ${{ inputs.application_name }}-lifecycle-${{ inputs.environment }}-${{ github.run_id }}

      - name: Execute non-production action
        run: |
          arguments=(
            --environment "$KILL_ENVIRONMENT"
            --application-name "$APPLICATION_NAME"
            --action "$KILL_ACTION"
            --confirm "$KILL_CONFIRMATION"
          )
          if [[ "$KILL_ACTION" != "STOP" ]]; then
            arguments+=(--state-bucket "$STATE_BUCKET")
          fi
          if [[ "$KILL_APPLY" == "true" ]]; then arguments+=(--apply); fi
          bash poorman-aws/bin/kill-non-production "${arguments[@]}"
